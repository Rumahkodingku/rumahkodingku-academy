name: CI

on:
  push:
    branches: ["dev", "main", "master"]
  pull_request:
    branches: ["dev", "main", "master"]

jobs:
  ci:
    name: Format, Lint, Type Check, Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: rumahkodingku_academy
          MYSQL_USER: academy_user
          MYSQL_PASSWORD: academy_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify database migrations
        env:
          DATABASE_URL: mysql://academy_user:academy_password@127.0.0.1:3306/rumahkodingku_academy
        run: pnpm --filter @rumahkodingku-academy/db db:migrate

      - name: Create test database
        env:
          MYSQL_PWD: rootpassword
        run: |
          mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE IF NOT EXISTS rumahkodingku_academy_test"
          mysql -h 127.0.0.1 -uroot -e "GRANT ALL PRIVILEGES ON rumahkodingku_academy_test.* TO 'academy_user'@'%'"
          mysql -h 127.0.0.1 -uroot -e "FLUSH PRIVILEGES"

      - name: Migrate test database
        env:
          DATABASE_URL: mysql://academy_user:academy_password@127.0.0.1:3306/rumahkodingku_academy_test
        run: pnpm --filter @rumahkodingku-academy/db db:migrate

      - name: Generate API types
        run: pnpm --filter web generate:api

      - name: Check generated API types
        run: |
          pnpm exec oxfmt --write apps/web/src/lib/api/schema.d.ts
          git diff --exit-code -- apps/web/src/lib/api/schema.d.ts

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Check for role-name authorization
        run: |
          if grep -RInE 'role(Name)?[[:space:]]*===|\.role[[:space:]]*===|=== *["'"'"'`](admin|user)["'"'"'`]' apps/api/src --include='*.ts'; then
            echo "Role-name comparison found. Check permissions instead."
            exit 1
          fi

      - name: Type check
        run: pnpm run check-types

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Store contract tests
        env:
          DATABASE_URL: mysql://academy_user:academy_password@127.0.0.1:3306/rumahkodingku_academy_test
          REDIS_URL: redis://127.0.0.1:6379
        run: pnpm --filter api test:contract

      - name: Auth API integration tests
        env:
          DATABASE_URL: mysql://academy_user:academy_password@127.0.0.1:3306/rumahkodingku_academy_test
          REDIS_URL: redis://127.0.0.1:6379
        run: pnpm --filter api test:integration
