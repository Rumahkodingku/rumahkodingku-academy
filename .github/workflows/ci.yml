name: CI

on:
  push:
    branches: ["dev", "main", "master"]
  pull_request:
    branches: ["dev", "main", "master"]

jobs:
  ci:
    name: Format, Lint, Type Check, Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: rumahkodingku_academy
          MYSQL_USER: academy_user
          MYSQL_PASSWORD: academy_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify database migrations
        env:
          DATABASE_URL: mysql://academy_user:academy_password@127.0.0.1:3306/rumahkodingku_academy
        run: pnpm --filter @rumahkodingku-academy/db db:migrate

      - name: Create test database
        env:
          MYSQL_PWD: rootpassword
        run: |
          mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE IF NOT EXISTS rumahkodingku_academy_test"
          mysql -h 127.0.0.1 -uroot -e "GRANT ALL PRIVILEGES ON rumahkodingku_academy_test.* TO 'academy_user'@'%'"
          mysql -h 127.0.0.1 -uroot -e "FLUSH PRIVILEGES"

      - name: Migrate test database
        env:
          DATABASE_URL: mysql://academy_user:academy_password@127.0.0.1:3306/rumahkodingku_academy_test
        run: pnpm --filter @rumahkodingku-academy/db db:migrate

      - name: Generate API types
        run: pnpm --filter web generate:api

      - name: Check generated API types
        run: |
          pnpm exec oxfmt --write apps/web/src/lib/api/schema.d.ts
          git diff --exit-code -- apps/web/src/lib/api/schema.d.ts

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Check for role-name authorization
        run: |
          if grep -RInE 'role(Name)?[[:space:]]*===|\.role[[:space:]]*===|=== *["'"'"'`](admin|user)["'"'"'`]' apps/api/src --include='*.ts'; then
            echo "Role-name comparison found. Check permissions instead."
            exit 1
          fi

      - name: Type check
        run: pnpm run check-types

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Store contract tests
        env:
          DATABASE_URL: mysql://academy_user:academy_password@127.0.0.1:3306/rumahkodingku_academy_test
          REDIS_URL: redis://127.0.0.1:6379
        run: pnpm --filter api test:contract

      - name: Auth API integration tests
        env:
          DATABASE_URL: mysql://academy_user:academy_password@127.0.0.1:3306/rumahkodingku_academy_test
          REDIS_URL: redis://127.0.0.1:6379
        run: pnpm --filter api test:integration

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: rumahkodingku_academy
          MYSQL_USER: academy_user
          MYSQL_PASSWORD: academy_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 8026:8025
          - 1026:1025

    env:
      DATABASE_URL: mysql://academy_user:academy_password@127.0.0.1:3306/rumahkodingku_academy
      REDIS_URL: redis://127.0.0.1:6379
      CORS_ORIGIN: http://localhost:3001
      WEB_APP_URL: http://localhost:3001
      NEXT_PUBLIC_SERVER_URL: http://localhost:3001
      API_URL: http://localhost:3000
      EMAIL_SMTP_HOST: 127.0.0.1
      EMAIL_SMTP_PORT: 1026
      AUTH_SESSION_COOKIE: access_token
      AUTH_REFRESH_COOKIE: refresh_token
      MAILPIT_URL: http://127.0.0.1:8026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate database
        run: pnpm --filter @rumahkodingku-academy/db db:migrate

      - name: Seed RBAC
        run: pnpm --filter @rumahkodingku-academy/db db:seed:rbac

      - name: Create admin smoke
        env:
          ADMIN_EMAIL: admin@example.com
          ADMIN_NAME: Academy Admin
          ADMIN_PASSWORD: correct-horse-battery
        run: pnpm --filter @rumahkodingku-academy/db auth:create-admin

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run Playwright
        run: pnpm exec playwright test --workers=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
