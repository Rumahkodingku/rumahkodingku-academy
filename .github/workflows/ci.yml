name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  ci:
    name: Format, Lint, Type Check, Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: rumahkodingku_academy
          MYSQL_USER: academy_user
          MYSQL_PASSWORD: academy_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify database migrations
        env:
          DATABASE_URL: mysql://academy_user:academy_password@127.0.0.1:3306/rumahkodingku_academy
        run: pnpm --filter @rumahkodingku-academy/db db:migrate

      - name: Generate API types
        run: pnpm --filter web generate:api

      - name: Check generated API types
        run: |
          pnpm exec oxfmt --write apps/web/src/lib/api/schema.d.ts
          git diff --exit-code -- apps/web/src/lib/api/schema.d.ts

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check-types

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test
