# Docker Compose for rumahkodingku-academy
# Local infrastructure and application orchestration.
# Coolify deployment will map the same services to its managed resources.

name: rumahkodingku-academy

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: rumahkodingku-academy-web
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SERVER_URL=http://localhost:3000
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - rumahkodingku-academy-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rumahkodingku-academy-api
    ports:
      - "3000:3000"
      - "9090:9090"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - CORS_ORIGIN=http://localhost:3001
      - DATABASE_URL=mysql://academy_user:academy_password@mysql:3306/rumahkodingku_academy
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-}
      - CSRF_SECRET=${CSRF_SECRET:-}
      - JWT_ISSUER=${JWT_ISSUER:-http://localhost:3000}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-web}
      - UPLOAD_ROOT=/app/apps/api/uploads
      - LOG_LEVEL=info
      - METRICS_PORT=9090
      - METRICS_PATH=/metrics
      - METRICS_PREFIX=rumahkodingku_academy_
      - POSTHOG_API_KEY=
      - POSTHOG_HOST=https://us.i.posthog.com
      - EMAIL_SMTP_HOST=mailpit
      - EMAIL_SMTP_PORT=1025
      - EMAIL_SMTP_USER=
      - EMAIL_SMTP_PASSWORD=
    volumes:
      - api_uploads:/app/apps/api/uploads
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - rumahkodingku-academy-network

  mysql:
    image: mysql:8
    container_name: rumahkodingku-academy-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: rumahkodingku_academy
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rumahkodingku-academy-network

  redis:
    image: redis:7-alpine
    container_name: rumahkodingku-academy-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rumahkodingku-academy-network

  prometheus:
    image: prom/prometheus:latest
    container_name: rumahkodingku-academy-prometheus
    ports:
      - "9091:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - rumahkodingku-academy-network

  grafana:
    image: grafana/grafana:latest
    container_name: rumahkodingku-academy-grafana
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - rumahkodingku-academy-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: rumahkodingku-academy-mailpit
    ports:
      - "8026:8025"
      - "1026:1025"
    restart: unless-stopped
    networks:
      - rumahkodingku-academy-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rumahkodingku-academy-cloudflared
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - cloudflared_config:/home/nonroot/.cloudflared
    restart: unless-stopped
    depends_on:
      - web
      - api
      - grafana
    networks:
      - rumahkodingku-academy-network

networks:
  rumahkodingku-academy-network:
    driver: bridge

volumes:
  mysql_data:
  api_uploads:
  redis_data:
  prometheus_data:
  grafana_data:
  cloudflared_config:
